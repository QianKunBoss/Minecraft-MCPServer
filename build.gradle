plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runConfigs {
        client {
            vmArgs.add("--add-opens=java.base/java.lang=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.lang.reflect=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.util=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.util.concurrent=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.io=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.net=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.nio=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.text=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.desktop/java.awt.font=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.desktop/java.awt=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.desktop/javax.imageio=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.desktop/javax.swing=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.desktop/java.beans=ALL-UNNAMED")
        }
        server {
            vmArgs.add("--add-opens=java.base/java.lang=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.lang.reflect=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.util=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.util.concurrent=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.io=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.net=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/java.nio=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/sun.security.x509=ALL-UNNAMED")
            vmArgs.add("--add-opens=java.base/sun.security.util=ALL-UNNAMED")
        }
    }

    mods {
        "mcpserver" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name 'luck-repo'
        url 'https://repo.lucko.me/'
        content {
            includeModule 'me.lucko', 'spark-api'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.google.code.gson:gson:2.10.1"

    implementation 'org.bouncycastle:bcprov-jdk18on:1.76'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.76'

    modCompileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'
    modImplementation include('me.lucko:spark-api:0.1-SNAPSHOT')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_dependency", project.minecraft_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "minecraft_dependency": project.minecraft_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
